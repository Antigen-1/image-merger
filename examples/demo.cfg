;; image-merger demo configuration.
;;
;; Run from the project root:
;;   .venv/bin/python examples/gen-fixtures.py
;;   bin/image-merger examples/demo.cfg
;;
;; Image and output paths are relative to this file's directory.
(image-merger
  (output "out.png")
  (canvas
    (background "#1a1a2e")
    (margin 20)
    (gap 10 10)
    (cell-size 160 120)
    (grid 2 3))
  (cell (row 0) (column 0) (image "img0.png") (scale fit))
  (cell (row 0) (column 1) (image "img1.png") (scale fill))
  (cell (row 0) (column 2) (image "img2.png") (scale stretch))
  ;; row 1, column 0 is intentionally left empty (background shows through)
  (cell (row 1) (column 1) (image "img3.png") (scale none) (align right bottom))
  (cell (row 1) (column 2) (image "img4.png") (scale (exact 80 60)) (align left top))
  (row-labels
    (band 28)
    (start 1)
    (style (size 14) (color "#ffffff") (align right middle)))
  (column-labels
    (band 24)
    (style (size 14) (color "#ffffff") (align center bottom))
    (texts "A" "B" "C")))
